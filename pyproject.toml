[project]
name = "chess-coach-mcp"
version = "0.1.0"
description = "MCP server that pulls chess.com games and turns them into Stockfish-backed coaching reports"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "python-chess>=1.10",
    "starlette>=0.27",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-coach-mcp = "chess_coach.server:main"
chess-coach-web = "chess_coach.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chess_coach = ["web_static/*", "benchmarks.json", "knowledge/sources.json", "knowledge/principles/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
